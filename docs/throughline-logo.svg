<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 104" fill="none" role="img" aria-label="Throughline — Studio OS">
  <!-- ============================================================
       THROUGHLINE logo lockup
       Mark: a single continuous line that threads through three
       nodes and rises to an apex — the narrative spine of film and
       the connective logic of automation, made one stroke.
       Gold (#C8A24A) on transparent; wordmark in a refined serif.
       ============================================================ -->
  <defs>
    <linearGradient id="tlGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E2C173"/>
      <stop offset="0.55" stop-color="#C8A24A"/>
      <stop offset="1" stop-color="#A6822F"/>
    </linearGradient>
  </defs>

  <!-- brand tile -->
  <rect x="14" y="26" width="52" height="52" rx="14"
        fill="#0C1E55" stroke="#1B2F6B" stroke-width="1"/>
  <!-- the throughline mark -->
  <g transform="translate(24,38)">
    <path d="M2 30 C 11 30, 13 8, 26 8 S 39 30, 50 30"
          stroke="url(#tlGold)" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <circle cx="2"  cy="30" r="3"   fill="url(#tlGold)"/>
    <circle cx="26" cy="8"  r="3.6" fill="url(#tlGold)"/>
    <circle cx="50" cy="30" r="3"   fill="url(#tlGold)"/>
  </g>

  <!-- wordmark -->
  <text x="84" y="58" font-family="'Fraunces','Georgia',serif"
        font-size="36" font-weight="600" letter-spacing="0.3" fill="#E8EBF5">Throughline</text>
  <text x="86" y="80" font-family="'Hanken Grotesk','Helvetica Neue',Arial,sans-serif"
        font-size="11" font-weight="600" letter-spacing="6" fill="#9AA5C8">STUDIO&#160;&#160;OS</text>
</svg>
